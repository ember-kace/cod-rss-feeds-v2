name: Refresh and publish RSS

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Publish validated output even when the live feed bytes match
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'data/state.schema.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: production-rss-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    outputs:
      deploy: ${{ steps.live.outputs.deploy }}
      publication_sha: ${{ steps.publication.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install tested dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Check public metadata and credential hygiene
        run: python scripts/check_privacy.py
      - name: Set repository automation identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect, validate, and persist durable state
        run: python scripts/persist.py
      - name: Recheck generated publication privacy
        run: python scripts/check_privacy.py
      - name: Validate complete publication
        run: python scripts/validate.py
      - name: Record the validated publication commit
        id: publication
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compare live publication, including pending output
        id: live
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy && 'true' || 'false' }}
        run: python scripts/verify_deployment.py --needs-deployment --github-output
      - name: Configure Pages
        if: steps.live.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload only validated public files
        if: steps.live.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.publication_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify anonymous HTTPS endpoints and event pages
        run: python scripts/verify_deployment.py --full-manifest --base-url '${{ steps.deployment.outputs.page_url }}'
